<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Tickets – find a movie you both want to watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f16; --bg-glow:#17233a; --surface:#141c29; --surface2:#1b2535; --line:#2a3650;
  --text:#eef1f7; --soft:#c5cde0; --muted:#93a0bb; --faint:#5d6a86;
  --p1:#ff8a4c; --p2:#3fd0c9; --match:#ffd36b;
  --turn:var(--p1);
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 560px at 50% -12%,var(--bg-glow) 0%,transparent 62%),var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
kbd{font:600 12px/1 var(--display);padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--soft)}
:focus-visible{outline:2px solid var(--match);outline-offset:3px}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:18px;padding:18px 32px;min-height:72px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:-.02em;font-stretch:88%;background:none;border:0;padding:0;cursor:default}
.brand svg{width:40px;height:23px;display:block}
.top .grow{flex:1}
.gsum{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:600;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);padding:10px 18px;cursor:pointer;transition:transform .15s,background .15s,border-color .15s}
.btn:hover{background:var(--surface2);border-color:#40517a}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--match);border-color:var(--match);color:#1d1600}
.btn.primary:hover{background:#ffe08f}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text)}
.btn.big{padding:15px 26px;font-size:17px}
.btn[disabled]{opacity:.38;cursor:not-allowed;pointer-events:none}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--match);color:#1d1600;font-size:13px;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;border:1px dashed #475a85;background:transparent;cursor:pointer;color:var(--soft);font-weight:500}
.pill b{letter-spacing:.14em;color:var(--text)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.pill .dot.on{background:var(--p2);box-shadow:0 0 10px var(--p2)}

/* ---------- setup ---------- */
.setup{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,470px);gap:72px;align-items:center;width:100%;max-width:1180px;margin:0 auto;padding:24px 40px 72px}
.hero .bigmark{width:210px;height:auto;display:block;overflow:visible}
.bigmark .a,.bigmark .b{transform-box:fill-box;transform-origin:center;animation:pop .85s cubic-bezier(.2,.9,.3,1.15) both}
.bigmark .b{animation-delay:.14s}
.bigmark .lens{animation:glow 1s .75s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:none}}
@keyframes glow{from{opacity:0}to{opacity:1}}
.hero h1{font-size:clamp(46px,5.6vw,80px);line-height:.96;letter-spacing:-.035em;font-weight:800;font-stretch:80%;margin:30px 0 20px;max-width:11ch}
.hero p{font-family:var(--serif);font-size:22px;line-height:1.5;color:var(--soft);max-width:34ch;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:15px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:transparent;color:var(--muted);padding:11px 8px;border-radius:11px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--surface2);color:var(--text)}
.panel .lead{margin:0 0 18px;color:var(--muted);font-size:15px}
.field{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 16px;margin-bottom:12px;transition:border-color .15s}
.field:focus-within{border-color:var(--match)}
.field i{flex:none;width:12px;height:12px;border-radius:50%}
.field input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:17px;padding:13px 0}
.field input::placeholder{color:var(--faint)}
.field input.code{letter-spacing:.32em;text-transform:uppercase;font-weight:700}
.panel .btn.wide{width:100%;margin-top:6px}
.or{display:flex;align-items:center;gap:14px;color:var(--faint);font-size:14px;margin:20px 0 16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.joinrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.joinrow .field{margin:0}
.note{margin:14px 0 0;font-size:14px;color:var(--muted)}
.err{margin:14px 0 0;font-size:14px;color:#ff9d8c}
.resume{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);background:rgba(255,211,107,.06);border-radius:16px;padding:14px 16px;margin-bottom:20px}
.resume p{margin:0;font-size:15px}
.resume small{display:block;color:var(--muted);font-size:13px}
.resume .acts{display:flex;gap:8px;flex:none}
.resume .btn{padding:8px 14px;font-size:14px}

/* ---------- genres ---------- */
.genres{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:12px 40px 0}
.genres h2{font-size:clamp(34px,3.6vw,48px);letter-spacing:-.03em;font-stretch:85%;font-weight:800;margin:6px 0 8px}
.genres .sub{margin:0 0 26px;font-family:var(--serif);font-size:20px;color:var(--soft)}
.roombar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);margin:0 0 22px}
.roombar .code{font-size:30px;font-weight:800;letter-spacing:.2em;color:var(--match);cursor:pointer;background:none;border:0;padding:0}
.roombar .who{display:flex;gap:18px;color:var(--muted);font-size:15px;margin-left:auto}
.roombar .who span{display:inline-flex;align-items:center;gap:8px}
.roombar .who i{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.roombar .who .ok i{background:var(--c);box-shadow:0 0 10px var(--c)}
.roombar .who .ok{color:var(--text)}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.gtile{position:relative;aspect-ratio:3/2;border-radius:20px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--surface);cursor:pointer;text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}
.gtile svg{position:absolute;inset:0;width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.gtile:hover svg{transform:scale(1.06)}
.gtile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.78))}
.gtile .lbl{position:absolute;left:16px;right:16px;bottom:13px;z-index:2;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.gtile .lbl b{font-size:25px;font-weight:800;letter-spacing:-.02em;font-stretch:88%}
.gtile .lbl small{font-size:13px;color:var(--soft)}
.gtile .tick{position:absolute;top:12px;right:12px;z-index:2;width:30px;height:30px;border-radius:50%;background:var(--match);color:#1d1600;display:grid;place-items:center;font-weight:800;opacity:0;transform:scale(.4);transition:opacity .18s,transform .22s cubic-bezier(.3,1.5,.5,1)}
.gtile.on{border-color:var(--match);box-shadow:0 0 0 2px var(--match),0 18px 50px -18px rgba(255,211,107,.45);transform:translateY(-3px)}
.gtile.on .tick{opacity:1;transform:none}
.gfoot{position:sticky;bottom:0;margin:30px -40px 0;padding:18px 40px calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(10,15,22,0),rgba(10,15,22,.92) 30%);backdrop-filter:blur(8px)}
.gfoot .count{font-size:17px;color:var(--soft)}
.gfoot .count b{color:var(--text)}
.gfoot .grow{flex:1}

/* ---------- swipe stage ---------- */
.stage{flex:1;display:grid;grid-template-columns:minmax(170px,240px) minmax(0,780px) minmax(170px,240px);gap:24px;justify-content:center;align-items:start;padding:6px 32px 48px}
.side{--c:var(--p1);padding:22px 20px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 11%,var(--surface)),var(--surface));transition:border-color .25s,box-shadow .25s;position:sticky;top:12px}
.side.p2{--c:var(--p2)}
.side.active{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 46px -10px color-mix(in srgb,var(--c) 60%,transparent)}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--c);color:#0d121a;display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:14px}
.side .nm{font-size:21px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;word-break:break-word}
.side .you{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.status{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:15px;color:var(--muted)}
.status i{width:9px;height:9px;border-radius:50%;background:var(--faint);flex:none}
.status.live{color:var(--text)}
.status.live i{background:var(--c);animation:beat 1.4s ease-in-out infinite}
.status.done i{background:var(--c)}
@keyframes beat{50%{transform:scale(1.7);opacity:.45}}
.side .liked{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.side .liked b{color:var(--text);font-size:20px;margin-right:6px}
.keys{display:flex;align-items:center;gap:7px;margin-top:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}

.center{min-width:0}
.playarea{position:relative}
.cardwrap{position:relative}
.cardwrap::before,.cardwrap::after{content:"";position:absolute;inset:0;border-radius:28px;background:var(--surface2);border:1px solid var(--line);z-index:0}
.cardwrap::before{transform:translateY(14px) scale(.955);opacity:.55}
.cardwrap::after{transform:translateY(7px) scale(.978);opacity:.85}
.card{position:relative;z-index:1;display:grid;grid-template-columns:minmax(210px,37%) 1fr;min-height:440px;background:var(--surface);border:1px solid var(--line);border-radius:28px;overflow:hidden;box-shadow:0 36px 90px -26px rgba(0,0,0,.85)}
.card.enter{animation:enter .42s cubic-bezier(.2,.8,.2,1) both}
.card.fade{animation:fadein .35s ease both}
.card.out-left{transition:transform .28s cubic-bezier(.5,0,.9,.4),opacity .28s ease-in;transform:translateX(-125%) rotate(-9deg);opacity:0}
.card.out-right{transition:transform .28s cubic-bezier(.5,0,.9,.4),opacity .28s ease-in;transform:translateX(125%) rotate(9deg);opacity:0}
.card.pulse{animation:pulse .4s ease}
@keyframes enter{from{opacity:0;transform:translateY(22px) scale(.965)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pulse{40%{box-shadow:0 0 0 3px var(--turn),0 0 60px -6px var(--turn);transform:translateX(10px)}}
.poster{position:relative;background:#000;min-height:100%}
.poster svg,.art{position:absolute;inset:0;width:100%;height:100%;display:block}
.info{display:flex;flex-direction:column;gap:18px;padding:34px 38px 34px;min-width:0}
.cg{display:flex;flex-wrap:wrap;gap:8px}
.cg .chip{border-color:#3b4a6d;color:var(--soft)}
.title{margin:0;font-size:44px;line-height:1.02;letter-spacing:-.03em;font-weight:800;font-stretch:85%}
.title.long{font-size:34px}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:600;font-size:16px}
.fact.rate{color:var(--match);border-color:rgba(255,211,107,.35);background:rgba(255,211,107,.07)}
.fact.rate small{color:var(--muted);font-weight:500;margin-left:2px}
.desc{margin:0;font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--soft);max-width:44ch}

.controls{position:relative;z-index:2;display:flex;gap:18px;justify-content:center;margin-top:38px}
.vote{flex:1;max-width:310px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 20px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .15s,background .2s,border-color .2s,box-shadow .2s}
.vote .big{font-size:23px;font-weight:800;letter-spacing:-.01em}
.vote .big span{font-size:27px;margin-right:6px;vertical-align:-2px}
.vote .sub{font-size:14px;color:var(--muted)}
.vote kbd{margin-top:6px}
.vote.skip:hover{border-color:#7a88a8;background:var(--surface2)}
.vote.like{border-color:color-mix(in srgb,var(--turn) 65%,var(--line));background:color-mix(in srgb,var(--turn) 15%,var(--surface))}
.vote.like:hover{background:color-mix(in srgb,var(--turn) 27%,var(--surface));box-shadow:0 14px 44px -16px var(--turn)}
.vote:active{transform:scale(.97)}
.vote[disabled]{opacity:.35;cursor:not-allowed;pointer-events:none}
.left{text-align:center;margin:20px 0 0;color:var(--muted);font-size:15px}
.waiting{text-align:center;margin:26px 0 -18px;color:var(--soft);font-size:16px;min-height:24px}
.waiting::after{content:"";display:inline-block;width:1.2em;text-align:left;animation:dots 1.4s steps(4,end) infinite;overflow:hidden;vertical-align:bottom}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.cover{position:absolute;inset:-10px;z-index:5;border-radius:34px;display:grid;place-items:center;text-align:center;background:rgba(10,15,22,.74);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border:2px solid var(--p2);animation:fadein .3s ease both}
.cover .avatar{width:84px;height:84px;font-size:38px;margin:0 auto 18px;background:var(--p2)}
.cover h2{margin:0 0 8px;font-size:46px;font-weight:800;letter-spacing:-.03em;font-stretch:85%}
.cover p{margin:0 0 22px;color:var(--soft);font-size:17px}
.done{text-align:center;padding:70px 30px;border:1px solid var(--line);border-radius:28px;background:var(--surface)}
.done h2{font-size:40px;letter-spacing:-.03em;font-stretch:85%;margin:0 0 10px}
.done p{font-family:var(--serif);font-size:20px;color:var(--soft);margin:0 0 28px}
.done .row{display:flex;gap:12px;justify-content:center}

/* ---------- matches ---------- */
.matches{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:12px 40px 56px}
.mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:30px}
.mhead h2{margin:0;font-size:clamp(34px,3.6vw,48px);letter-spacing:-.03em;font-stretch:85%;font-weight:800}
.mhead p{margin:6px 0 0;font-family:var(--serif);font-size:20px;color:var(--soft)}
.mhead .acts{display:flex;gap:10px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:26px}
.mcard{display:flex;flex-direction:column;gap:12px}
.mcard .mp{position:relative;aspect-ratio:2/3;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px -22px rgba(0,0,0,.9);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mcard:hover .mp{transform:translateY(-6px) rotate(-.6deg)}
.mcard h3{margin:0;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.mcard .mm{display:flex;gap:12px;color:var(--muted);font-size:14px}
.mcard .mm .r{color:var(--match);font-weight:600}
.empty{text-align:center;border:1px dashed #3a4a6d;border-radius:28px;padding:80px 30px}
.empty h3{margin:0 0 8px;font-size:30px;letter-spacing:-.02em;font-stretch:85%}
.empty p{margin:0 0 26px;font-family:var(--serif);font-size:20px;color:var(--soft)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(6,9,14,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overflow:auto}
.overlay.anim{animation:fadein .25s ease both}
.overlay.anim .obox{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.obox{text-align:center;max-width:560px}
.match h1{margin:0 0 20px;font-size:clamp(64px,9vw,112px);line-height:.92;font-weight:800;letter-spacing:-.04em;font-stretch:78%;background:linear-gradient(100deg,var(--p1) 5%,var(--match) 50%,var(--p2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em .06em}
.opos{position:relative;width:170px;aspect-ratio:2/3;margin:0 auto 22px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.2);box-shadow:0 30px 70px -20px rgba(0,0,0,.9),0 0 80px -10px rgba(255,211,107,.35);transform:rotate(-3deg)}
.obox h2{margin:0 0 6px;font-size:34px;line-height:1.05;letter-spacing:-.03em;font-stretch:85%;font-weight:800}
.obox .meta{margin:0 0 6px;color:var(--soft);font-size:17px}
.obox .say{margin:0 0 28px;font-family:var(--serif);font-size:20px;color:var(--muted)}
.obox .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pickbox .opos{width:200px;transform:none}
.pickbox .tag{display:inline-block;margin-bottom:16px;padding:6px 14px;border-radius:999px;background:rgba(255,211,107,.12);border:1px solid rgba(255,211,107,.4);color:var(--match);font-weight:600;font-size:15px}
#fx{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
#fx i{position:absolute;top:-28px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;padding:12px 20px;border-radius:14px;background:#222d42;border:1px solid #3b4a6d;color:var(--text);font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(90vw,520px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- live AI ---------- */
.livebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 22px;padding:12px 16px;border:1px solid rgba(63,208,201,.28);border-radius:15px;background:rgba(63,208,201,.06);color:var(--soft);font-size:14px}
.livebar .live-dot{width:9px;height:9px;border-radius:50%;background:var(--p2);box-shadow:0 0 12px var(--p2)}
.ai-note{display:inline-flex;align-items:center;gap:7px;color:var(--p2);font-size:13px;font-weight:700}
.ai-reason{margin:-8px 0 0;padding:12px 14px;border-left:2px solid var(--p2);background:rgba(63,208,201,.06);border-radius:0 10px 10px 0;color:var(--soft);font-size:14px;line-height:1.45}
.live-loading{display:grid;place-items:center;min-height:440px;text-align:center;padding:50px}
.live-loading .spin{width:42px;height:42px;border:3px solid var(--line);border-top-color:var(--match);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 18px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .setup{grid-template-columns:1fr;gap:40px;padding:12px 28px 56px}
  .hero h1{max-width:14ch}
  .stage{grid-template-columns:1fr 1fr;grid-template-areas:"a b" "c c";padding:6px 24px 40px}
  .stage .side.p1{grid-area:a}.stage .side.p2{grid-area:b}.stage .center{grid-area:c}
  .side{position:static}

function wrapTitle(t){

const posterCache=new Map();

  if(posterCache.has(m.id))return posterCache.get(m.id);
  const g=m.genres[0],p=PAL[g]||PAL.Drama,R=rng(hash(m.title+m.year)),u='pz'+m.id;
  const lines=wrapTitle(m.title);
  const longest=Math.max(...lines.map(l=>l.length));
  let fs=Math.min(66,330/(longest*.52));fs=Math.min(fs,168/(lines.length*.94));
  const tx=lines.map((l,i)=>`<text x="30" y="${(546-(lines.length-1-i)*fs*.94).toFixed(1)}" font-size="${fs.toFixed(1)}">${esc(l)}</text>`).join('');
  const svg=`<svg class="art" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Generated poster for ${esc(m.title)}" style="font-family:var(--display)"><defs><linearGradient id="${u}g" x1="0" y1="0" x2=".25" y2="1"><stop offset="0" stop-color="${p[0]}"/><stop offset="1" stop-color="${p[1]}"/></linearGradient><linearGradient id="${u}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".84"/></linearGradient><filter id="${u}n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></defs><rect width="400" height="600" fill="url(#${u}g)"/>${motif(g,R,p,u)}<rect y="330" width="400" height="270" fill="url(#${u}s)"/><rect width="400" height="600" filter="url(#${u}n)" opacity=".14" style="mix-blend-mode:overlay"/><rect x="12" y="12" width="376" height="576" rx="4" fill="none" stroke="#fff" stroke-opacity=".22"/><text x="30" y="54" font-size="17" fill="#fff" fill-opacity=".8" style="font-weight:600;letter-spacing:.08em">${m.year}</text><g fill="#fff" style="font-weight:800;font-stretch:75%;letter-spacing:-.01em">${tx}</g></svg>`;
  posterCache.set(m.id,svg);return svg;
}

const S={
  mode:null,            // 'local' | 'online'
  screen:'setup',       // setup | genres | swipe | matches
  form:{tab:'local',n1:'',n2:'',name:'',code:''},
  names:{p1:'Player 1',p2:'Player 2'},
  votes:{p1:{},p2:{}},  // movieId -> 1 (like) | 0 (skip)
  genres:[],deck:[],sel:new Set(),
  matchLog:[],knownMatches:new Set(),matchQueue:[],
  overlay:null,handoff:false,busy:false,editingGenres:false,leaveArm:false,
  me:'p1',room:null,present:{},rev:undefined,lastRevMine:null,joinedAt:0,lastPick:0,

function resolved(id){const a=S.votes.p1[id],b=S.votes.p2[id];return a===0||b===0||(a===1&&b===1)}
function curId(){for(const id of S.deck){if(!resolved(id))return id}return null}
function matchIds(){return Object.keys(S.votes.p1).map(Number).filter(id=>S.votes.p1[id]===1&&S.votes.p2[id]===1)}
function orderedMatches(){
  const ids=new Set(matchIds());const out=S.matchLog.filter(id=>ids.has(id));
  ids.forEach(id=>{if(!out.includes(id))out.push(id)});return out;
}
function activeSlot(){
  if(S.mode==='online')return S.me;
  const id=curId();return S.votes.p1[id]===undefined?'p1':'p2';
}
function buildDeck(genres){
  const set=new Set(genres);
  const ids=MOVIES.filter(m=>m.genres.some(g=>set.has(g))&&!resolved(m.id)).map(m=>m.id);
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  return ids;
}

async function loadLiveRecommendations(genres,{pageStart=1,limit=120,pageCount=5}={}){
  const excludeIds=(S.liveMovies||[]).map(m=>m.tmdbId).filter(Boolean);
  const res=await fetch('/api/recommend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({genres,limit,pageStart,pageCount,excludeIds})});
  if(!res.ok){let msg='Live recommendations failed';try{const j=await res.json();msg=j.error||msg}catch(_){}throw new Error(msg)}
  const data=await res.json();
  if(!Array.isArray(data.movies))throw new Error('Invalid recommendation response');
  const start=MOVIES.length;
  const fresh=data.movies.map((m,i)=>({
    id:start+i,title:m.title||'Untitled',year:Number(m.year)||0,genres:Array.isArray(m.genres)?m.genres:genres,
    rating:Number(m.rating)||0,runtime:Number(m.runtime)||0,desc:m.overview||'A current movie recommendation.',
    posterPath:m.posterPath||'',tmdbId:m.tmdbId,aiReason:m.reason||'',live:true
  }));
  MOVIES.push(...fresh);
  return {ids:fresh.map(m=>m.id),movies:fresh,nextPage:Number(data.nextPage)||pageStart+pageCount,hasMore:data.hasMore!==false,source:data.source,aiUsed:data.aiUsed,aiError:data.aiError,candidateCount:data.candidateCount};
}

async function loadMoreLiveMovies(force=false){
  if(S.loadingMore||S.liveExhausted||!S.genres.length||S.working)return;
  const remaining=S.deck.filter(i=>!resolved(i)).length;
  if(!force&&remaining>40)return;
  S.loadingMore=true;render();
  try{
    const batch=await loadLiveRecommendations(S.genres,{pageStart:S.livePage,limit:120,pageCount:5});
    if(batch.ids.length){
      S.deck.push(...batch.ids);
      S.liveMovies.push(...batch.movies);
      S.livePage=batch.nextPage;
      if(!batch.hasMore)S.liveExhausted=true;
      if(S.mode==='online'){
        const rev=Date.now();S.rev=rev;S.lastRevMine=rev;
        const code=S.room,deck=S.deck,movies=S.liveMovies;
        enqueue(()=>S.db.doc(`rooms/${code}`).set({genres:S.genres,deck,movies,rev}));
      }else saveLocal();
      toast(`Loaded ${batch.ids.length} live movies${batch.aiUsed?' · AI ranked':''}`);
    }else{
      S.liveExhausted=true;
    }
  }catch(e){
    console.warn(e);
    S.error=e.message||'Could not load more live movies right now.';
  }finally{S.loadingMore=false;render()}
}

const fmtRun=m=>`${Math.floor(m/60)}h ${m%60}m`;
const initial=n=>esc(((n||'').trim()[0]||'?').toUpperCase());
const genreList=gs=>gs.length<=3?gs.join(', '):gs.slice(0,3).join(', ')+` +${gs.length-3}`;

function confetti(){

  for(let i=0;i<48;i++){

    fx.appendChild(s);
  }

}

/* ---------- local persistence ---------- */
function saveLocal(){
  if(S.mode!=='local')return;
  LS.set('tt:local',{names:S.names,genres:S.genres,deck:S.deck,liveMovies:S.liveMovies||[],votes:S.votes,matchLog:S.matchLog});
}

/* =====================================================================
   MATCHES
   ===================================================================== */
function scanMatches(silent){
  for(const id of matchIds()){
    if(!S.knownMatches.has(id)){
      S.knownMatches.add(id);
      if(!S.matchLog.includes(id))S.matchLog.push(id);
      if(!silent)S.matchQueue.push(id);
    }
  }
  showNextMatch();
}
function showNextMatch(){
  if(!S.overlay&&S.matchQueue.length){
    S.overlay={type:'match',id:S.matchQueue.shift(),fresh:true};
    setTimeout(confetti,60);
  }
}
function closeOverlay(){
  S.overlay=null;showNextMatch();render();
}

/* =====================================================================
   VOTING
   ===================================================================== */
function canVote(){
  if(S.busy||S.overlay||S.handoff||S.screen!=='swipe')return false;
  const id=curId();if(id===null)return false;
  return S.votes[activeSlot()][id]===undefined;
}
function vote(v){
  if(!canVote())return;
  const id=curId(),slot=activeSlot();
  const partnerLiked=S.votes[other(slot)][id]===1;
  const resolves=v===0||partnerLiked;
  S.busy=true;
  const el=document.querySelector('.card');
  if(el)el.classList.add(resolves?(v?'out-right':'out-left'):'pulse');
  setTimeout(()=>{
    S.votes[slot][id]=v;S.busy=false;
    if(S.mode==='online')pushVotes();else saveLocal();
    scanMatches(false);
    if(S.mode==='local'&&v===1&&slot==='p1'&&S.votes.p2[id]===undefined)S.handoff=true;
    render();
    // Keep the experience continuous: replenish before the couple reaches the end.
    if(v===0||partnerLiked)loadMoreLiveMovies(false);
  },reduced?0:(resolves?270:380));
}

let writeChain=Promise.resolve();
function enqueue(fn){writeChain=writeChain.then(fn).catch(dbError);return writeChain}
function dbError(e){
  const code=e&&e.code;
  S.working=false;
  if(code==='invalid_argument'||code==='not_granted')S.error='This account can open the page but can\u2019t save to it, so two-device rooms won\u2019t work here. Use Same screen instead, or ask the owner to share the page with edit access.';
  else if(code==='quota_exceeded')S.error='This page\u2019s storage is full, so a new room can\u2019t be created.';
  else S.error='Couldn\u2019t reach the room. Check your connection and try again.';
  toast(S.error.length>90?'Couldn\u2019t reach the room':S.error);
  render();
}
const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){let c='';for(let i=0;i<4;i++)c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return c}
function pushVotes(){
  const code=S.room,me=S.me;
  const payload={votes:Object.assign({},S.votes[me]),name:S.names[me]};
  enqueue(()=>S.db.doc(`rooms/${code}/votes/${me}`).set(payload));
}
function detach(){S.unsubs.forEach(u=>{try{u()}catch(e){}});S.unsubs=[]}
function attachRoom(){
  detach();
  const db=S.db,code=S.room;S.hydrated=false;S.joinedAt=Date.now();S.present={};
  const bad=e=>dbError(e);
  S.unsubs.push(db.doc(`rooms/${code}`).onSnapshot(onRoom,bad));
  S.unsubs.push(db.collection(`rooms/${code}/votes`).onSnapshot(onVotes,bad));
  S.unsubs.push(db.doc(`rooms/${code}/meta/pick`).onSnapshot(onPick,bad));
}
function mergeLiveMovies(list){
  if(!Array.isArray(list))return new Map();
  const map=new Map();
  for(const raw of list){
    if(!raw||raw.tmdbId==null)continue;
    let existing=MOVIES.find(m=>String(m.tmdbId)===String(raw.tmdbId));
    if(!existing){
      const id=MOVIES.length;
      existing={...raw,id,live:true};
      MOVIES.push(existing);
    }
    map.set(String(raw.id),existing.id);
    map.set(String(raw.tmdbId),existing.id);
  }
  return map;
}

function onRoom(snap){
  if(!snap.exists)return;
  const d=snap.data()||{};const genres=d.genres||[];
  const idMap=mergeLiveMovies(d.movies||[]);
  S.deck=(d.deck||[]).map(id=>idMap.get(String(id))??id);
  S.liveMovies=d.movies||[];S.genres=genres;
  if(S.rev!==undefined&&d.rev!==S.rev&&d.rev!==S.lastRevMine&&S.screen==='swipe'&&genres.length)toast('Genres changed to '+genreList(genres));
  S.rev=d.rev;
  if(S.screen==='genres'&&!S.editingGenres&&genres.length)S.screen='swipe';
  render();
}
function onVotes(snap){
  const prev=curId();
  snap.docs.forEach(doc=>{
    const slot=doc.id;if(slot!=='p1'&&slot!=='p2')return;
    const d=doc.data()||{};const theirs=d.votes||{};
    S.votes[slot]=slot===S.me?Object.assign({},theirs,S.votes[slot]):Object.assign({},theirs);
    if(d.name)S.names[slot]=d.name;
    S.present[slot]=true;
  });
  const first=!S.hydrated;S.hydrated=true;
  const me=S.me,o=other(me);
  if(!first&&prev!==null&&S.votes[me][prev]===1&&S.votes[o][prev]===0)toast(`${S.names[o]} passed on ${MOVIES[prev].title}`);
  scanMatches(first);
  render();
}
function onPick(snap){
  if(!snap.exists)return;
  const d=snap.data()||{};
  if(d.ts>S.lastPick&&d.by!==S.me&&d.ts>S.joinedAt-4000&&MOVIES[d.id]){S.lastPick=d.ts;runPick(d.id)}
}
async function createRoom(){
  if(!S.db||S.working)return;
  const name=(S.form.name||'').trim()||'Player 1';
  S.working=true;S.error='';render();
  try{
    let code,tries=0,free=false;
    while(tries++<8){code=genCode();const s=await S.db.doc(`rooms/${code}`).get();if(!s.exists){free=true;break}}
    if(!free)throw {code:'unavailable'};
    const rev=Date.now();
    await S.db.doc(`rooms/${code}`).set({genres:[],deck:[],rev,created:rev});
    await S.db.doc(`rooms/${code}/votes/p1`).set({votes:{},name:name});
    freshSession('online');S.me='p1';S.room=code;S.names={p1:name,p2:'Player 2'};S.rev=rev;S.lastRevMine=rev;
    LS.set('tt:room',{code,slot:'p1',name});
    S.working=false;S.screen='genres';attachRoom();render();
  }catch(e){dbError(e)}
}
async function joinRoom(){
  if(!S.db||S.working)return;
  const code=(S.form.code||'').trim().toUpperCase();
  const name=(S.form.name||'').trim()||'Player 2';
  if(code.length!==4){S.error='Enter the 4-character room code.';render();return}
  S.working=true;S.error='';render();
  try{
    const room=await S.db.doc(`rooms/${code}`).get();
    if(!room.exists){S.working=false;S.error='No room with that code. Check it and try again.';render();return}
    const mine=await S.db.doc(`rooms/${code}/votes/p2`).get();
    const saved=LS.get('tt:room');
    const mineOk=saved&&saved.code===code&&saved.slot==='p2';
    if(mine.exists&&!mineOk){S.working=false;S.error='That room already has two players.';render();return}
    const votes=mine.exists?((mine.data()||{}).votes||{}):{};
    await S.db.doc(`rooms/${code}/votes/p2`).set({votes,name});
    freshSession('online');S.me='p2';S.room=code;S.names={p1:'Player 1',p2:name};S.votes.p2=Object.assign({},votes);
    LS.set('tt:room',{code,slot:'p2',name});
    const d=room.data()||{};S.rev=d.rev;
    S.working=false;S.screen=(d.genres||[]).length?'swipe':'genres';attachRoom();render();
  }catch(e){dbError(e)}
}
async function rejoinRoom(){
  const saved=LS.get('tt:room');if(!saved||!S.db||S.working)return;
  S.working=true;S.error='';render();
  try{
    const room=await S.db.doc(`rooms/${saved.code}`).get();
    if(!room.exists){LS.del('tt:room');S.working=false;S.error='That room no longer exists.';render();return}
    freshSession('online');S.me=saved.slot;S.room=saved.code;
    S.names[saved.slot]=saved.name||S.names[saved.slot];
    const d=room.data()||{};S.rev=d.rev;
    S.working=false;S.screen=(d.genres||[]).length?'swipe':'genres';attachRoom();render();
  }catch(e){dbError(e)}
}

/* ---------- pick for us ---------- */
function startPick(){
  const ms=orderedMatches();if(!ms.length||(S.overlay&&S.overlay.spinning))return;
  const final=ms[Math.floor(Math.random()*ms.length)];
  if(S.mode==='online'){
    const ts=Date.now(),room=S.room,by=S.me;S.lastPick=ts;
    enqueue(()=>S.db.doc(`rooms/${room}/meta/pick`).set({id:final,ts,by}));
  }
  runPick(final);
}
function runPick(final){
  const ms=orderedMatches();if(!ms.length)ms.push(final);
  S.overlay={type:'pick',id:final,shown:ms[0],spinning:true,fresh:true};
  render();
  const steps=reduced?1:(ms.length>1?14:3);let i=0;
  const tick=()=>{
    if(!S.overlay||S.overlay.type!=='pick')return;
    i++;const last=i>=steps;
    const id=last?final:ms[Math.floor(Math.random()*ms.length)];
    S.overlay.shown=id;paintReel(id);
    if(last){S.overlay.spinning=false;render();confetti()}
    else setTimeout(tick,55+i*i*1.3);
  };
  setTimeout(tick,reduced?10:260);
}
function paintReel(id){
  const m=MOVIES[id];
  const p=document.querySelector('.pickposter'),t=document.querySelector('.picktitle'),mt=document.querySelector('.pickmeta');
  if(p)p.innerHTML=poster(m);if(t)t.textContent=m.title;
  if(mt)mt.textContent=`${m.year}  \u00B7  ${fmtRun(m.runtime)}  \u00B7  \u2605 ${m.rating.toFixed(1)}`;
}

function freshSession(mode){
  detach();

  S.matchLog=[];S.knownMatches=new Set();S.matchQueue=[];S.liveMovies=[];S.overlay=null;S.handoff=false;S.busy=false;
  S.editingGenres=false;S.present={};S.room=null;S.rev=undefined;S.lastRevMine=null;S.error='';S._lastCur=undefined;S.leaveArm=false;
}
function resetToSetup(){

async function startGenres(){
  const genres=[...S.sel];if(!genres.length||S.working)return;
  S.genres=genres;S.editingGenres=false;S._lastCur=undefined;S.working=true;S.error='';S.screen='swipe';render();
  try{
    const first=await loadLiveRecommendations(genres,{pageStart:1,limit:120,pageCount:5});
    S.livePage=first.nextPage;S.liveExhausted=!first.hasMore;
    S.deck=first.ids;
    if(!S.deck.length)throw new Error('No live movies matched those genres. Try another combination.');
    S.liveMovies=first.movies;
    if(first.aiError) console.warn('AI ranking unavailable; using TMDB results:', first.aiError);
    if(S.mode==='online'){
      const rev=Date.now();S.rev=rev;S.lastRevMine=rev;
      const code=S.room,deck=S.deck,movies=S.liveMovies;
      enqueue(()=>S.db.doc(`rooms/${code}`).set({genres,deck,movies,rev}));
    }else saveLocal();
  }catch(e){
    console.error(e);
    S.deck=[]; S.liveMovies=[]; S.liveExhausted=false;
    S.error=`Live movie loading failed: ${e.message||'unknown error'}. Check the server terminal and your API keys.`;
  }finally{S.working=false;render()}
}
function goSwipe(){
  S.screen=(S.genres.length&&S.deck.length)?'swipe':'genres';

function side(slot,id){
  const online=S.mode==='online';
  const me=online&&slot===S.me;
  const act=activeSlot();
  const isActive=online?me:slot===act;
  const v=S.votes[slot][id];
  let status,cls;
  if(online){
    if(!me&&!S.present[slot]){status='Hasn\u2019t joined yet';cls='idle'}
    else if(v!==undefined){status=me?(v?'You liked it':'You passed'):'Voted';cls='done'}
    else{status=me?'Your turn':'Deciding\u2026';cls='live'}
  }else{
    if(v!==undefined){status='Voted';cls='done'}
    else if(slot===act){status='Voting now';cls='live'}
    else{status='Up next';cls='idle'}
  }
  const liked=Object.values(S.votes[slot]).filter(x=>x===1).length;
  const keys=(isActive&&v===undefined)?`<div class="keys"><kbd>\u2190</kbd> skip <kbd>\u2192</kbd> like</div>`:'';
  return `<aside class="side ${slot} ${isActive?'active':''}"><div class="avatar">${initial(S.names[slot])}</div><div class="nm">${esc(S.names[slot])}${me?'<span class="you">You</span>':''}</div><div class="status ${cls}"><i></i>${status}</div><div class="liked"><b>${liked}</b>liked so far</div>${keys}</aside>`;
}

        <p class="desc">${esc(m.desc)}</p>${m.aiReason?`<div class="ai-reason"><span class="ai-note">✦ AI pick</span><br>${esc(m.aiReason)}</div>`:''}

function render(){
  const ae=document.activeElement;
  const keep=(ae&&ae.id&&$app.contains(ae))?{id:ae.id,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const sc=S.screen;
  const body=sc==='setup'?viewSetup():sc==='genres'?viewGenres():sc==='matches'?viewMatches():viewSwipe();
  if(sc!=='swipe')S._lastCur=undefined;
  $app.innerHTML=header()+body+overlays();
  if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.e)}catch(_){}}}
  const af=$app.querySelector('[data-autofocus]:not([disabled])');if(af)af.focus({preventScroll:true});
}

const H={
  tab(t){S.form.tab=t.dataset.tab;S.error='';render()},
  'start-local'(){
    const f=S.form;
    freshSession('local');
    S.names={p1:(f.n1||'').trim()||'Player 1',p2:(f.n2||'').trim()||'Player 2'};
    S.screen='genres';saveLocal();render();
  },
  'resume-local'(){
    const sl=LS.get('tt:local');if(!sl)return;
    freshSession('local');
    S.names=sl.names;S.genres=sl.genres||[];const lm=mergeLiveMovies(sl.liveMovies||[]);S.liveMovies=sl.liveMovies||[];S.deck=(sl.deck||[]).map(id=>lm.get(String(id))??id);S.votes={p1:sl.votes.p1||{},p2:sl.votes.p2||{}};S.matchLog=sl.matchLog||[];
    S.sel=new Set(S.genres);
    matchIds().forEach(id=>S.knownMatches.add(id));
    const c=curId();
    S.handoff=c!==null&&S.votes.p1[c]===1&&S.votes.p2[c]===undefined;
    S.screen=S.genres.length?'swipe':'genres';render();
  },
  'forget-local'(){LS.del('tt:local');render()},
  'forget-room'(){LS.del('tt:room');render()},
  create(){createRoom()},join(){joinRoom()},rejoin(){rejoinRoom()},
  'toggle-genre'(t){
    const g=t.dataset.g;if(S.sel.has(g))S.sel.delete(g);else S.sel.add(g);
    t.classList.toggle('on',S.sel.has(g));t.setAttribute('aria-pressed',S.sel.has(g));
    document.getElementById('gfoot').innerHTML=genreFooter();
  },
  'all-genres'(){if(S.sel.size===GENRES.length)S.sel=new Set();else S.sel=new Set(GENRES);render()},
  'start-genres'(){startGenres()},
  'back-genres'(){S.editingGenres=false;S.screen='swipe';render()},
  'change-genres'(){S.sel=new Set(S.genres);S.editingGenres=true;S.screen='genres';render()},
  matches(){S.screen='matches';render()},
  'matches-from-overlay'(){S.overlay=null;S.matchQueue=[];S.screen='matches';render()},
  'try-another'(){goSwipe()},
  skip(){vote(0)},like(){vote(1)},
  'handoff-ok'(){S.handoff=false;render()},
  'close-overlay'(){if(S.overlay&&S.overlay.spinning)return;closeOverlay()},
  pick(){startPick()},'pick-again'(){startPick()},
  'copy-code'(){
    try{navigator.clipboard.writeText(S.room).then(()=>toast('Room code copied'),()=>toast('Room code: '+S.room))}catch(e){toast('Room code: '+S.room)}
  },
  leave(){
    if(!S.leaveArm){S.leaveArm=true;render();clearTimeout(H._lt);H._lt=setTimeout(()=>{S.leaveArm=false;render()},3000);return}
    clearTimeout(H._lt);
    if(S.mode==='online')LS.del('tt:room');else LS.del('tt:local');
    resetToSetup();
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  if(t.dataset.act==='handoff-ok'&&e.target.closest('button')&&t.classList.contains('cover')){/* button handles it */}
  const fn=H[t.dataset.act];if(fn)fn(t,e);
});
document.addEventListener('input',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='n1')S.form.n1=v;else if(id==='n2')S.form.n2=v;else if(id==='yname')S.form.name=v;
  else if(id==='code'){S.form.code=v.toUpperCase().replace(/[^A-Z0-9]/g,'')}
});
document.addEventListener('keydown',e=>{
  if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;
  const tag=document.activeElement&&document.activeElement.tagName;
  const typing=tag==='INPUT'||tag==='TEXTAREA';
  if(S.overlay){
    if(e.key==='Escape'||e.key==='Enter'||e.key===' '){
      if(S.overlay.spinning)return;
      e.preventDefault();closeOverlay();
    }
    return;
  }
  if(typing){
    if(e.key==='Enter'&&S.screen==='setup'){
      e.preventDefault();
      if(S.form.tab==='local')H['start-local']();
      else if(document.activeElement.id==='code')joinRoom();
      else createRoom();
    }
    return;
  }
  if(S.handoff&&S.screen==='swipe'){
    if(['Shift','Control','Alt','Meta','Tab','CapsLock'].includes(e.key))return;
    e.preventDefault();S.handoff=false;render();return;
  }
  if(S.screen==='swipe'){
    if(e.key==='ArrowLeft'){e.preventDefault();vote(0)}
    else if(e.key==='ArrowRight'){e.preventDefault();vote(1)}
  }else if(S.screen==='matches'&&e.key==='Escape'){goSwipe()}
});

/* ---------- boot ---------- */
render();
(async()=>{
  try{if(window.claude&&typeof claude.use==='function')S.db=await claude.use('db')}catch(e){S.db=null}
  S.dbReady=true;
  if(S.screen==='setup')render();
})();
</script>
</body>
</html>
